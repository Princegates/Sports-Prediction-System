; Socca Intelligence -- member count widget for Rainmeter (see ../README.md).
; Put your key on the Key= line below. Nothing else needs editing.

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!CommandMeasure mData "Update"]

[Variables]
Key=PASTE_YOUR_KEY_HERE
Url=https://api.soccaintel.com/api/public/widget/users?key=#Key#
Accent=40,200,170
Muted=150,165,180

; Reads the feed once a minute (60 skin updates of 1 second each).
[mData]
Measure=WebParser
URL=#Url#
UpdateRate=60
RegExp=(?siU)"total_users":\s*(\d+).*"new_today":\s*(\d+).*"active_access":\s*(\d+).*"unverified":\s*(\d+)

[mTotal]
Measure=WebParser
URL=[mData]
StringIndex=1
Substitute="":"-"

[mToday]
Measure=WebParser
URL=[mData]
StringIndex=2
Substitute="":"-"

[mAccess]
Measure=WebParser
URL=[mData]
StringIndex=3
Substitute="":"-"

[mWaiting]
Measure=WebParser
URL=[mData]
StringIndex=4
Substitute="":"-"

[Background]
Meter=Shape
Shape=Rectangle 0,0,230,128,16 | Fill Color 16,22,32,240 | StrokeWidth 1 | Stroke Color #Accent#,110

[Title]
Meter=String
X=18
Y=14
FontFace=Segoe UI Semibold
FontSize=9
FontColor=#Muted#
StringCase=Upper
Text=Socca users
AntiAlias=1

[Total]
Meter=String
MeasureName=mTotal
X=18
Y=26
FontFace=Segoe UI Semibold
FontSize=34
FontColor=255,255,255
NumOfDecimals=0
Text=%1
AntiAlias=1

[Today]
Meter=String
MeasureName=mToday
X=18
Y=82
FontFace=Segoe UI
FontSize=10
FontColor=#Accent#
Text=+%1 today
AntiAlias=1

[Access]
Meter=String
MeasureName=mAccess
X=100
Y=82
FontFace=Segoe UI
FontSize=10
FontColor=#Muted#
Text=%1 with access
AntiAlias=1

[Status]
Meter=String
X=18
Y=102
FontFace=Segoe UI
FontSize=8
FontColor=#Muted#
Text=Refreshes every minute - click to refresh now
AntiAlias=1

; Click the widget to refresh now.
[ClickArea]
Meter=Shape
Shape=Rectangle 0,0,230,128 | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure mData "Update"]
