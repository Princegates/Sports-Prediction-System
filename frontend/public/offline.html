<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#161616" />
  <title>You're offline — Socca Intelligence</title>
  <style>
    /* Self-contained: this page is served from the service worker's cache
       with no network, and the site's CSP forbids inline scripts, so it is
       plain HTML and CSS only. */
    :root { color-scheme: dark light; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #161616; color: #f4f4f6; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; box-sizing: border-box; }
    main { max-width: 420px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 22px; margin: 18px 0 8px; }
    p { margin: 0 0 20px; line-height: 1.55; color: #b9bac2; font-size: 15px; }
    a { display: inline-block; background: #ff6115; color: #fff; text-decoration: none; font-weight: 600;
        padding: 12px 22px; border-radius: 10px; }
    @media (prefers-color-scheme: light) {
      body { background: #f4f4f6; color: #15161a; }
      p { color: #55565e; }
    }
  </style>
</head>
<body>
  <main>
    <img src="/brand/icon-192.png" alt="" width="72" height="72" />
    <h1>You're offline</h1>
    <p>Socca Intelligence needs a connection to load fresh predictions and odds. Check your signal or Wi-Fi and try again.</p>
    <a href="/app/">Try again</a>
  </main>
</body>
</html>
