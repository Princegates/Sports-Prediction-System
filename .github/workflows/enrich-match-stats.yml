# Backfills shots, corners, cards and referee onto matches already in the
# database -- see backend/scripts/enrich_match_stats.py. Never inserts a
# match or deletes anything, so it's safe to re-run; re-running with the
# same leagues/seasons just re-matches and overwrites the same stat columns.
name: Enrich match stats

on:
  workflow_dispatch:
    inputs:
      leagues:
        description: "Space-separated football-data.co.uk league codes"
        required: false
        default: "E0 SP1 I1 D1 F1"
      seasons:
        description: "Space-separated football-data.co.uk season codes"
        required: false
        default: "2122 2223 2324 2425 2526 2627"
      show_unmatched:
        description: "List fixture names that failed to resolve"
        type: boolean
        required: false
        default: false

jobs:
  enrich-match-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Enrich match stats
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LEAGUES: ${{ inputs.leagues }}
          SEASONS: ${{ inputs.seasons }}
          SHOW_UNMATCHED: ${{ inputs.show_unmatched }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set."
            exit 1
          fi
          ARGS="--leagues $LEAGUES --seasons $SEASONS"
          if [ "$SHOW_UNMATCHED" = "true" ]; then
            ARGS="$ARGS --show-unmatched"
          fi
          python scripts/enrich_match_stats.py $ARGS
