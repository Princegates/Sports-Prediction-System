# Keeps the ~45 CL_RESOLVER_LEAGUES (app/data/providers/api_football.py)
# current -- domestic leagues tracked only so a Champions League club from
# outside the 9 main leagues (Celtic, Club Brugge, Qarabağ, ...) has a real
# Team row and Elo history to resolve its CL ties against, instead of those
# fixtures being silently skipped.
#
# Deliberately separate from refresh-predictions.yml rather than folded into
# it: that workflow's "retrain" already fits a gradient-boosting model and
# full backtest per league, which is exactly the cost these 45 leagues don't
# need (see rebuild_elo_only.py's own docstring on why) -- adding them there
# would have multiplied that workflow's runtime and database egress for data
# nothing in this product uses on its own. This workflow does only fixture
# import (cheap, one API-Football request per league) and a plain Elo
# replay, both of which are safe to run daily.
#
# Runs before refresh-predictions.yml's 06:00 UTC daily refresh so that
# run's Champions League predictions see today's Elo/Match data for these
# clubs, not yesterday's.
name: Refresh CL resolver leagues

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons to import, space-separated (e.g. 2021 2022 2023 2024 2025 2026). Blank = current season only."
        required: false
        default: ""
      rebuild_elo:
        description: "Also rebuild Elo history after importing"
        required: false
        default: "yes"
        type: choice
        options: ["yes", "no"]

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Check DATABASE_URL
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set."
            exit 1
          fi
          python scripts/check_database_url.py

      - name: Import fixtures for CL resolver leagues
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEASONS: ${{ inputs.seasons }}
        run: |
          mapfile -t LEAGUES_ARR < <(python -c "from app.data.providers.api_football import CL_RESOLVER_LEAGUES; print(chr(10).join(CL_RESOLVER_LEAGUES))")
          echo "${#LEAGUES_ARR[@]} leagues"
          # 45 leagues x up to ~10 seasons in one backfill dispatch is ~450
          # requests -- comfortably under the 7,500/day Pro budget, but
          # above import_api_football.py's own 200 default ceiling.
          FLAGS=(--leagues "${LEAGUES_ARR[@]}" --max-requests 500)
          if [ -n "$SEASONS" ]; then
            mapfile -t SEASONS_ARR < <(xargs -n1 <<<"$SEASONS")
            FLAGS+=(--seasons "${SEASONS_ARR[@]}")
          fi
          python scripts/import_api_football.py "${FLAGS[@]}"

      - name: Rebuild Elo history for CL resolver leagues
        if: ${{ inputs.rebuild_elo != 'no' }}
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/rebuild_elo_only.py
