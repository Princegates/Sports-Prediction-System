# Merges club-identity fragments: an established Team row and a fresh
# stub for the same club under a different spelling, both in the same
# league -- see scripts/merge_duplicate_teams.py for how these happened.
#
# Dry run unless "confirm" is set to MERGE. The default only lists what
# would be merged and what points at the rows that would go.
name: Merge duplicate teams

on:
  workflow_dispatch:
    inputs:
      league:
        description: "League to check (blank = every league)"
        required: false
        default: "English Premier League"
        type: choice
        options:
          - "English Premier League"
          - "Spanish La Liga"
          - "Italian Serie A"
          - "German Bundesliga"
          - "French Ligue 1"
          - "Turkish Süper Lig"
          - ""
      confirm:
        description: 'Type MERGE to actually merge. Anything else is a dry run.'
        required: false
        default: ""

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Merge
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LEAGUE: ${{ inputs.league }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          FLAGS=""
          if [ "$CONFIRM" = "MERGE" ]; then
            FLAGS="--delete"
          else
            echo "Dry run: 'confirm' is not MERGE, so nothing will change."
          fi
          if [ -n "$LEAGUE" ]; then
            python scripts/merge_duplicate_teams.py --league "$LEAGUE" $FLAGS
          else
            python scripts/merge_duplicate_teams.py $FLAGS
          fi
