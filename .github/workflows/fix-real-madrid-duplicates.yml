# Corrects Match #10970 / #10976 (Real Madrid stored as both home and away)
# to the real opponent, Club Atlético de Madrid -- see
# backend/scripts/fix_real_madrid_duplicates.py for the full reasoning.
# One-off: written for these two specific rows, not a general repair tool.
name: Fix Real Madrid duplicates

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the change (unchecked = dry run, prints the plan only)"
        required: false
        default: "no"
        type: choice
        options: ["no", "yes"]

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Fix
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set."
            exit 1
          fi
          FLAGS=()
          [ "$APPLY" = "yes" ] && FLAGS+=(--apply)
          python scripts/fix_real_madrid_duplicates.py "${FLAGS[@]}"
