# Separates two real clubs that were wrongly merged into one row, using
# API-Football's fixtures to decide which stored match was whose -- see
# backend/app/data/club_split.py. Dry run unless apply is "yes". One
# API-Football request per competition per season.
name: Split merged club

on:
  workflow_dispatch:
    inputs:
      league:
        description: "League both clubs play in"
        required: false
        default: "Italian Serie A"
      merged_name:
        description: "The surviving row's current name"
        required: false
        default: "AC Milan"
      restore_name:
        description: "Name for the club being separated out"
        required: false
        default: "FC Internazionale Milano"
      restore_aliases:
        description: "Other spellings of that club, space-separated and quoted"
        required: false
        default: '"Inter" "Internazionale" "Inter Milan"'
      competitions:
        description: "Competitions to check, space-separated and quoted"
        required: false
        default: '"Italian Serie A" "UEFA Champions League" "UEFA Europa League"'
      seasons:
        description: "Seasons (start year), space-separated"
        required: false
        default: "2021 2022 2023 2024 2025 2026"
      apply:
        description: "Write the changes (no = dry run)"
        required: false
        default: "no"
        type: choice
        options: ["no", "yes"]

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Split
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LEAGUE: ${{ inputs.league }}
          MERGED: ${{ inputs.merged_name }}
          RESTORE: ${{ inputs.restore_name }}
          ALIASES: ${{ inputs.restore_aliases }}
          COMPETITIONS: ${{ inputs.competitions }}
          SEASONS: ${{ inputs.seasons }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set."
            exit 1
          fi
          FLAGS=()
          [ "$APPLY" = "yes" ] && FLAGS+=(--apply)

          # ALIASES/COMPETITIONS/SEASONS arrive as a shell-quoted-looking
          # string ("a" "b c") so this workflow's own input box can take a
          # list -- turning that into real argv entries used to go through
          # `eval`, which executes anything embedded in the value (a backtick,
          # `$(...)`, or `;`) with this step's own DATABASE_URL secret in
          # scope. `xargs` parses the same quoting but only ever runs `echo`
          # with the result, so it tokenizes without ever executing what it
          # tokenizes. Declared empty first and only populated when non-blank
          # -- `xargs -n1 <<<""` still runs `echo` once on bash's own
          # trailing newline, which would otherwise hand
          # --restore-aliases a single empty-string value instead of none.
          ALIASES_ARR=(); [ -n "$ALIASES" ] && mapfile -t ALIASES_ARR < <(xargs -n1 <<<"$ALIASES")
          COMPETITIONS_ARR=(); [ -n "$COMPETITIONS" ] && mapfile -t COMPETITIONS_ARR < <(xargs -n1 <<<"$COMPETITIONS")
          SEASONS_ARR=(); [ -n "$SEASONS" ] && mapfile -t SEASONS_ARR < <(xargs -n1 <<<"$SEASONS")

          python scripts/split_merged_club.py \
            --league "$LEAGUE" \
            --merged-name "$MERGED" \
            --restore-name "$RESTORE" \
            --restore-aliases "${ALIASES_ARR[@]}" \
            --competitions "${COMPETITIONS_ARR[@]}" \
            --seasons "${SEASONS_ARR[@]}" \
            "${FLAGS[@]}"
