# Polls API-Football's live board so a match actually in progress shows up
# in the Live Match Center on its own, instead of needing someone to open
# its Live tab and push a simulated event by hand.
#
# fixtures?live=all is not scoped per league or season -- one request covers
# every match live anywhere, so this costs exactly 1 request per run
# regardless of how many matches are on.
#
# No schedule trigger here anymore: GitHub's "every 5 minutes" cron turned
# out to be best-effort in name only. In production this fired every 1-5
# *hours*, not every 5 minutes -- high-frequency schedule triggers are
# heavily throttled on GitHub's infrastructure, which is a platform limit
# no amount of retrying from this workflow can fix. The backend (a
# persistent web process, not serverless) now runs the same sync loop
# in-process every 5 minutes on its own -- see app.main's
# `_live_sync_loop` / `run_live_sync_from_settings`. This workflow stays
# only as a manual fallback (e.g. to force a sync without waiting on the
# backend's own timer, or to run it against a database the deployed
# backend isn't pointed at).
#
# Set DATABASE_URL under Settings -> Secrets and variables -> Actions.
name: Sync live matches

on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Sync live matches
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set -- nothing to sync."
            exit 0
          fi
          python scripts/sync_live_matches.py
