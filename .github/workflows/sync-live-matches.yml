# Polls API-Football's live board every few minutes so a match actually in
# progress shows up in the Live Match Center on its own, instead of needing
# someone to open its Live tab and push a simulated event by hand.
#
# fixtures?live=all is not scoped per league or season -- one request covers
# every match live anywhere, so this costs exactly 1 request per run
# regardless of how many matches are on. At 5-minute intervals that is
# ~288 requests/day: negligible against a Pro plan's 7,500/day, but more
# than the *entire* daily allowance on API-Football's free tier (100/day).
# If the saved key is a free-tier key, either raise the cron interval below
# or delete the schedule trigger and rely on workflow_dispatch only.
#
# GitHub's schedule trigger is best-effort and commonly lands a few minutes
# late, especially on a public repo under load. That is fine here: a few
# minutes of staleness on an in-play probability is not the same failure
# mode as a wrong prediction.
#
# Set DATABASE_URL under Settings -> Secrets and variables -> Actions.
name: Sync live matches

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Sync live matches
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set -- nothing to sync."
            exit 0
          fi
          python scripts/sync_live_matches.py
