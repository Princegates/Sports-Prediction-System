# Read-only. Runs the exact pool scripts/generate_random_picks.py and
# select_legs_by_confidence draw from (app.betcode.selection.
# build_confidence_candidates) against the real database and prints where
# it empties -- scheduled matches in the window across every league, how
# many have a Prediction row, and each one's best outcome by probability.
# Changes nothing.
name: Diagnose confidence pool

on:
  workflow_dispatch:
    inputs:
      league:
        description: "League to check (ALL = every league, matching random picks)"
        required: false
        default: "ALL"
      days_ahead:
        description: "Window in days (3 = daily random picks, 10 = weekly)"
        required: false
        default: "3"
      min_probability:
        description: "Minimum model probability, as a fraction (0.6 = 60%)"
        required: false
        default: "0.6"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Diagnose
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LEAGUE: ${{ inputs.league }}
          DAYS_AHEAD: ${{ inputs.days_ahead }}
          MIN_PROBABILITY: ${{ inputs.min_probability }}
        run: |
          ARGS=(--days-ahead "$DAYS_AHEAD" --min-probability "$MIN_PROBABILITY")
          if [ -n "$LEAGUE" ] && [ "$LEAGUE" != "ALL" ]; then
            ARGS+=(--league "$LEAGUE")
          fi
          python scripts/diagnose_confidence_pool.py "${ARGS[@]}"
