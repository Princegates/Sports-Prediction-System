# Read-only. Lists every still-pending AdminPick row (Admin Picks, This
# Week's Picks, jackpots, Random Picks) with each leg's current finished/
# grade state -- see scripts/inspect_pending_admin_picks.py for why "one
# leg won" doesn't mean the whole slip shows won. Changes nothing.
name: Inspect pending admin picks

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Only AdminPick.source exactly matching this (blank = every pending row)"
        required: false
        default: ""
      team:
        description: "Only slips with a leg involving a club whose name contains this"
        required: false
        default: ""
      include_settled:
        description: "Also show already-settled rows (their frozen result, not a fresh regrade)"
        type: boolean
        required: false
        default: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Inspect
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SOURCE: ${{ inputs.source }}
          TEAM: ${{ inputs.team }}
          INCLUDE_SETTLED: ${{ inputs.include_settled }}
        run: |
          ARGS=()
          [ -n "$SOURCE" ] && ARGS+=(--source "$SOURCE")
          [ -n "$TEAM" ] && ARGS+=(--team "$TEAM")
          [ "$INCLUDE_SETTLED" = "true" ] && ARGS+=(--include-settled)
          python scripts/inspect_pending_admin_picks.py "${ARGS[@]}"
