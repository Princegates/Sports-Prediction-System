# Emails every active account the current price -- see
# scripts/send_pricing_announcement_email.py. A one-time broadcast, not a
# recurring nudge, so this is workflow_dispatch only, never scheduled. Dry
# run by default (reports who'd be emailed and shows the message, sends
# nothing); set "send" to yes to actually dispatch.
name: Send pricing announcement email

on:
  workflow_dispatch:
    inputs:
      send:
        description: "Type yes to actually send. Anything else is a dry run."
        required: false
        default: "no"

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Send
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEND: ${{ inputs.send }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set."
            exit 1
          fi
          ARGS=()
          [ "$SEND" != "yes" ] && ARGS+=(--dry-run)
          python scripts/send_pricing_announcement_email.py "${ARGS[@]}"
