# Draws a fresh random, real-priced combo and sets it as the public teaser
# pick on the Welcome page -- see scripts/randomize_public_teaser_pick.py.
# No dry-run: this only ever replaces the one showcase combo, which is
# itself always just a pointer to real upcoming matches, never settled
# data worth protecting.
name: Randomize public teaser pick

on:
  workflow_dispatch:
    inputs:
      min_odds:
        description: "Target combined odds"
        required: false
        default: "5"

jobs:
  randomize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Randomize
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIN_ODDS: ${{ inputs.min_odds }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set."
            exit 1
          fi
          python scripts/randomize_public_teaser_pick.py --min-odds "$MIN_ODDS"
