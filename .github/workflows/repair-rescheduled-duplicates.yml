# Merges fixtures duplicated by a moved kickoff, before import_fixtures
# learned to reconcile that onto the existing row instead of inserting a
# new one.
#
# Same two clubs, same direction, kickoffs within a broadcaster-reschedule
# window -- the older row survives with the newer row's date, and anything
# pointing at the newer row moves onto it first. A genuine second meeting
# months later is never touched.
#
# Dry run unless "confirm" is set to MERGE. The default only lists what
# would be merged and what points at the row that would go.
name: Repair rescheduled duplicates

on:
  workflow_dispatch:
    inputs:
      league:
        description: "League to check"
        required: false
        default: "English Premier League"
        type: choice
        options:
          - "English Premier League"
          - "Spanish La Liga"
          - "Italian Serie A"
          - "German Bundesliga"
          - "French Ligue 1"
          - "Turkish Süper Lig"
      confirm:
        description: 'Type MERGE to actually merge. Anything else is a dry run.'
        required: false
        default: ""

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Repair
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LEAGUE: ${{ inputs.league }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          FLAGS=""
          if [ "$CONFIRM" = "MERGE" ]; then
            FLAGS="--delete"
          else
            echo "Dry run: 'confirm' is not MERGE, so nothing will change."
          fi
          python scripts/repair_rescheduled_duplicates.py --league "$LEAGUE" $FLAGS
