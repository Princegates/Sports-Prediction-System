# Manual only, on purpose.
#
# Every run spends from the daily request budget. A schedule would spend it
# whether or not anything changed, and the first thing you want from a new data
# source is to look at what it brought back before trusting it on a timer.
#
# The API key is read from the admin settings panel (Settings -> Data sources),
# so this job needs no secret of its own beyond DATABASE_URL -- the key lives
# in the database, and rotating it there takes effect here immediately.
name: Import API-Football

on:
  workflow_dispatch:
    inputs:
      leagues:
        description: "Space-separated, quoted league names"
        required: false
        default: '"UEFA Champions League"'
      odds:
        description: "Also capture market odds"
        required: false
        default: "no"
        type: choice
        options: ["no", "yes"]
      seasons:
        description: "Seasons, space-separated. Blank = current season only."
        required: false
        default: ""
      days_ahead:
        description: "Odds capture window in days (1 request per day, per league -- only used with odds: yes)"
        required: false
        default: "14"
      max_requests:
        description: "Hard ceiling for this run (Pro allows 7,500/day)"
        required: false
        default: "200"
      dry_run:
        description: "Print the plan and spend nothing"
        required: false
        default: "no"
        type: choice
        options: ["no", "yes"]

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Check DATABASE_URL
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/check_database_url.py

      - name: Import
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LEAGUES: ${{ inputs.leagues }}
          SEASONS: ${{ inputs.seasons }}
          DAYS_AHEAD: ${{ inputs.days_ahead }}
          MAX_REQUESTS: ${{ inputs.max_requests }}
          ODDS: ${{ inputs.odds }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          FLAGS=(--days-ahead "$DAYS_AHEAD" --max-requests "$MAX_REQUESTS")
          [ "$ODDS" = "yes" ] && FLAGS+=(--odds)
          [ "$DRY_RUN" = "yes" ] && FLAGS+=(--dry-run)

          # LEAGUES/SEASONS arrive as shell-quoted-looking strings ("a" "b c")
          # so the input box can take a list -- tokenized via xargs rather
          # than `eval` so a value containing `;` or `$(...)` is just a
          # league name, never something this step executes with
          # DATABASE_URL in its environment. Guarded on non-blank first --
          # `xargs -n1 <<<""` still runs once on bash's own trailing newline,
          # which would otherwise hand --leagues a single empty-string value
          # instead of falling through to the script's own default leagues.
          LEAGUES_ARR=(); [ -n "$LEAGUES" ] && mapfile -t LEAGUES_ARR < <(xargs -n1 <<<"$LEAGUES")
          [ -n "$SEASONS" ] && { mapfile -t SEASONS_ARR < <(xargs -n1 <<<"$SEASONS"); FLAGS+=(--seasons "${SEASONS_ARR[@]}"); }
          [ ${#LEAGUES_ARR[@]} -gt 0 ] && FLAGS+=(--leagues "${LEAGUES_ARR[@]}")

          python scripts/import_api_football.py "${FLAGS[@]}"

      # Every import checks its own work. Attaching a tie to the wrong club is
      # invisible in the data -- the fixture looks entirely normal -- so it has
      # to be looked for deliberately, and the moment to look is now.
      - name: Audit what was written
        if: always()
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LEAGUES: ${{ inputs.leagues }}
        run: |
          # Same tokenizing as the Import step above, not `eval` -- see its
          # comment for why.
          LEAGUES_ARR=(); [ -n "$LEAGUES" ] && mapfile -t LEAGUES_ARR < <(xargs -n1 <<<"$LEAGUES")
          for league in "${LEAGUES_ARR[@]}"; do
            python scripts/audit_european_fixtures.py --league "$league"
          done
