# Keeps the deployed system current, on GitHub's runners rather than a laptop.
#
# Two schedules, because the two halves of the job cost wildly different
# amounts:
#
#   - DAILY refresh: pull this season's fixtures and results from
#     API-Football (the only fixture source), regenerate predictions. Reads
#     the matches that changed. Cheap.
#   - WEEKLY retrain: rebuild Elo, refit the models and calibrators, backtest.
#     Reads every match in every league.
#
# Running the retrain nightly is what emptied a 5 GB monthly database-transfer
# allowance in two days. Model quality does not move meaningfully overnight --
# a week of new results does change it -- so the expensive half runs weekly and
# the cheap half runs daily.
#
# Trained models live on the runner's disk, which is destroyed with the runner,
# so they are carried between runs in the Actions cache. Without that, the
# daily job would find no model and quietly generate predictions with the
# gradient-boosting component missing from the blend -- the same numbers, just
# worse, with nothing in the log to say so.
#
# Set DATABASE_URL under Settings -> Secrets and variables -> Actions.
# For the first run, also set SUPERADMIN_EMAIL and SUPERADMIN_PASSWORD so the
# admin account is created; they are ignored once it exists.
name: Refresh predictions

on:
  schedule:
    # 06:00 UTC daily -- before most European kickoffs.
    - cron: "0 6 * * *"
    # 03:00 UTC Monday -- after the weekend's results are in.
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "refresh = results + predictions | retrain = also rebuild the models | seed = first full import"
        required: false
        default: refresh
        type: choice
        options: [refresh, retrain, seed]
      leagues:
        description: "Space-separated, quoted league names"
        required: false
        default: >-
          "English Premier League" "English Championship" "Spanish La Liga"
          "German Bundesliga" "Italian Serie A" "French Ligue 1"
          "Dutch Eredivisie" "Portuguese Primeira Liga" "Turkish Süper Lig"
          "UEFA Champions League" "UEFA Europa League"
      days_ahead:
        description: "How many days of upcoming fixtures to predict"
        required: false
        default: "10"
      weekly_picks:
        description: "Rebuild this week's system accumulators on a retrain (skip = keep the published ones)"
        required: false
        default: "yes"
        type: choice
        options: ["yes", "skip"]

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A retrain fits a model per league -- eleven of them now -- and a daily
    # refresh is minutes. This is the ceiling for the slow case; 120 was set
    # when the retrain covered five leagues.
    timeout-minutes: 240
    # Needed by "Commit sitemap if it changed" below, which pushes straight
    # to the default branch -- explicit rather than relying on whatever an
    # org sets as its GITHUB_TOKEN default (read-only on plenty of orgs).
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # restore/save rather than the combined action: a fixed key is never
      # updated once it exists, so each run saves under its own key and
      # restores from the most recent prefix match.
      - name: Restore trained models
        uses: actions/cache/restore@v4
        with:
          path: backend/model_artifacts
          key: model-artifacts-${{ github.run_id }}
          restore-keys: model-artifacts-

      # Fails in a second with a plain-English reason, rather than 40 minutes
      # in -- or, worse, with a SQLAlchemy traceback that says only "Could not
      # parse SQLAlchemy URL from given URL string". It prints the shape of the
      # value, never its contents.
      - name: Check DATABASE_URL
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set -- nothing to refresh."
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 0
          fi
          python scripts/check_database_url.py

      # Before prediction generation, not after -- predictions read stored
      # absences (app.prediction_service), they never fetch from the
      # provider themselves, so this has to land first or the day's
      # predictions go out blind to anyone reported out since yesterday.
      - name: Import injuries/suspensions
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LEAGUES: ${{ inputs.leagues || '"English Premier League" "English Championship" "Spanish La Liga" "German Bundesliga" "Italian Serie A" "French Ligue 1" "Dutch Eredivisie" "Portuguese Primeira Liga" "Turkish Süper Lig" "UEFA Champions League" "UEFA Europa League"' }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set -- nothing to import."
            exit 0
          fi
          # Shell-quoted-looking string ("a" "b c"), tokenized via xargs
          # rather than eval -- same reasoning as every other league list in
          # this repo's workflows (see the command-injection fix history).
          mapfile -t LEAGUES_ARR < <(xargs -n1 <<<"$LEAGUES")
          python scripts/import_injuries.py --leagues "${LEAGUES_ARR[@]}"

      - name: Refresh data, models and predictions
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPERADMIN_EMAIL: ${{ secrets.SUPERADMIN_EMAIL }}
          SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
          # Every league the site lists, so none of them goes stale: one
          # API-Football request each per day, and the weekly retrain reads
          # every league's history.
          LEAGUES: ${{ inputs.leagues || '"English Premier League" "English Championship" "Spanish La Liga" "German Bundesliga" "Italian Serie A" "French Ligue 1" "Dutch Eredivisie" "Portuguese Primeira Liga" "Turkish Süper Lig" "UEFA Champions League" "UEFA Europa League"' }}
          DAYS_AHEAD: ${{ inputs.days_ahead || '10' }}
          # The weekly cron retrains; the daily one doesn't. A manual run says
          # so explicitly.
          MODE: ${{ inputs.mode || (github.event.schedule == '0 3 * * 1' && 'retrain') || 'refresh' }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set -- nothing to refresh."
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 0
          fi

          # Fixtures and results come from API-Football only (one request per
          # league per season). refresh/retrain import the current season;
          # seed also backfills the five before it, for a fresh database.
          FLAGS=(--days-ahead "$DAYS_AHEAD")
          case "$MODE" in
            retrain) ;;
            refresh) FLAGS+=(--skip-training) ;;
            seed)
              Y=$(date -u +%Y); [ "$(date -u +%-m)" -lt 7 ] && Y=$((Y - 1))
              mapfile -t SEED_SEASONS < <(seq $((Y - 5)) $Y)
              FLAGS+=(--seasons "${SEED_SEASONS[@]}") ;;
            *)       echo "Unknown mode: $MODE" >&2; exit 1 ;;
          esac

          echo "Mode: $MODE"
          if [ -d model_artifacts ] && [ -n "$(ls -A model_artifacts 2>/dev/null)" ]; then
            echo "Restored models: $(ls model_artifacts | wc -l) file(s)"
          elif [ "$MODE" = "refresh" ]; then
            echo "::warning::No cached models found. Predictions this run will omit the"
            echo "::warning::gradient-boosting component. Run this workflow with mode=retrain."
          fi

          # LEAGUES arrives as a shell-quoted-looking string ("a" "b c") so
          # the input box can take a list -- tokenized via xargs rather than
          # `eval` (which this used to use) so a value containing `;` or
          # `$(...)` is just a league name, never something this step
          # executes with SUPERADMIN_PASSWORD and DATABASE_URL both in its
          # environment.
          mapfile -t LEAGUES_ARR < <(xargs -n1 <<<"$LEAGUES")
          python scripts/bootstrap.py "${FLAGS[@]}" --leagues "${LEAGUES_ARR[@]}"

      # Only on the weekly retrain, not the daily refresh -- "every match
      # week" means once a week, not reshuffled every morning. Runs after
      # the step above so it always searches this run's freshest
      # predictions and odds, pooled across every league (never just the
      # ones named in $LEAGUES -- see generate_weekly_picks.py).
      - name: Generate this week's system picks
        # A midweek manual retrain can pass weekly_picks: skip, so the
        # accumulators members may already have booked aren't swapped out.
        if: ${{ (inputs.mode || (github.event.schedule == '0 3 * * 1' && 'retrain') || 'refresh') == 'retrain' && inputs.weekly_picks != 'skip' }}
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set -- nothing to generate."
            exit 0
          fi
          python scripts/generate_weekly_picks.py
          python scripts/generate_high_risk_slips.py
          python scripts/generate_random_picks.py --which weekly

      # Same gate as the step above, on purpose: nothing new to announce
      # when that step didn't run. Off by default even when it does --
      # Settings -> Email -> "Email members about new weekly picks" has to
      # be turned on, and SMTP/Resend has to be configured, or this is a
      # no-op (see the script's own docstring).
      - name: Email members about this week's picks
        if: ${{ (inputs.mode || (github.event.schedule == '0 3 * * 1' && 'retrain') || 'refresh') == 'retrain' && inputs.weekly_picks != 'skip' }}
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set -- nothing to send."
            exit 0
          fi
          python scripts/send_weekly_picks_email.py

      # Every run, daily refresh or weekly retrain alike -- "Random Daily
      # Picks" means reshuffled every day, unlike the weekly draw above.
      # Runs after the refresh step so it always searches this run's
      # freshest predictions (see generate_random_picks.py).
      - name: Generate today's random picks
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set -- nothing to generate."
            exit 0
          fi
          python scripts/generate_random_picks.py --which daily

      # Every run, same reasoning as the random picks step above: upcoming
      # fixtures change daily (new ones added, old ones kicked off), so the
      # sitemap of per-fixture preview pages (frontend/src/pages/
      # FixturePreview.tsx) needs to track that daily too, not just on a
      # weekly retrain.
      - name: Regenerate sitemap
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set -- nothing to regenerate."
            exit 0
          fi
          python scripts/generate_sitemap.py

      # Commits straight to the branch this workflow is already running on
      # (the default branch, for every schedule/dispatch trigger this
      # workflow has) rather than opening a PR -- a generated sitemap file
      # has no judgment call in it for a human to review, so a PR here would
      # just be a rubber-stamp step between this running and the site
      # actually getting the current fixture list. Cloudflare Pages
      # redeploys on the push, same as any other commit to this repo.
      - name: Commit sitemap if it changed
        run: |
          if git diff --quiet -- frontend/public/sitemap.xml; then
            echo "Sitemap unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add frontend/public/sitemap.xml
            git commit -m "Update sitemap with current upcoming fixtures"
            git push origin HEAD:${{ github.ref_name }}
          fi

      # Saved even on failure: a run that trained some leagues and then died
      # shouldn't throw away the models it did produce.
      - name: Save trained models
        if: always()
        uses: actions/cache/save@v4
        with:
          path: backend/model_artifacts
          key: model-artifacts-${{ github.run_id }}
